# Render Blueprint — solo backend API
# Docs: https://render.com/docs/blueprint-spec
#
# Crear el servicio: Dashboard → New → Blueprint → conectar este repo.
# Los secretos marcados con sync: false se cargan una sola vez desde el
# Dashboard de Render y nunca se guardan en Git.

services:
  - type: web
    name: tributinfo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && corepack prepare pnpm@11.10.0 --activate && pnpm install
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: google
      - key: GOOGLE_AI_MODEL
        value: gemini-3.1-flash-lite
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: ZAVU_CHANNEL
        value: telegram
      - key: ZAVU_API_KEY
        sync: false
      - key: ZAVU_SENDER_ID
        sync: false
      - key: ZAVU_WEBHOOK_SECRET
        sync: false
      - key: ZAVU_WEBHOOK_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://tributinfo-buildathon-1.onrender.com
